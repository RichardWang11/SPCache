[Base]
ValueType=Float
DistCalcMethod=L2
IndexAlgoType=BKT
Dim=128
VectorPath=data/sift1m/sift/sift_base.fvecs
VectorType=XVEC
QueryPath=data/sift1m/sift/sift_query.fvecs
QueryType=XVEC
WarmupPath=data/sift1m/sift/sift_query.fvecs
WarmupType=XVEC
TruthPath=data/sift1m/sift/sift_groundtruth.ivecs
TruthType=XVEC
IndexDirectory=sift1m

[SelectHead]
isExecute=true
TreeNumber=1
BKTKmeansK=32
BKTLeafSize=8
SamplesNumber=1000
SaveBKT=false
SelectThreshold=50
SplitFactor=6
SplitThreshold=100
Ratio=0.16
NumberOfThreads=64
BKTLambdaFactor=-1

[BuildHead]
isExecute=true
NeighborhoodSize=32
TPTNumber=32
TPTLeafSize=2000
MaxCheck=8192
MaxCheckForRefineGraph=8192
RefineIterations=3
NumberOfThreads=64
BKTLambdaFactor=-1

[BuildSSDIndex]
isExecute=true
BuildSsdIndex=true
InternalResultNum=64
ReplicaCount=8
PostingPageLimit=12
NumberOfThreads=64
MaxCheck=8192
TmpDir=/tmp/

[SearchSSDIndex]
isExecute=true
BuildSsdIndex=false
InternalResultNum=32
SearchThreadNum=1                       # 线程数
HashTableExponent=12
ResultNum=10
MaxCheck=2048
MaxDistRatio=8.0
SearchPostingPageLimit=12               # 每个查询的搜索页数
TmpDir=tempfolder/
UseSPDK=false
EnableBufferPool=true
BufferPoolSize=2147483648
BufferPoolEvictionPolicy=LRU
BufferPoolHashTableExp=16               # 使用的哈希表指数
BufferPoolEvictionRatio=0.1            # 缓存淘汰比例
UseDirectIO=true                    # 启用直接 I/O